<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat WebSocket Tester</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --doctor: #5b9bd5;
    --patient: #52b788;
    --error: #e5484d;
    --system: #8b93a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  header .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  header label {
    font-size: 11px;
    color: var(--muted);
  }
  header input {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    width: 260px;
    font-family: ui-monospace, monospace;
  }
  header input:focus { outline: 1px solid #4a90e2; }

  .panes {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--panel-border);
    min-height: 0;
  }
  .pane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pane-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pane-header .who {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4b5163;
  }
  .dot.connected { background: #3ecf8e; }
  .dot.error { background: var(--error); }

  .status-text {
    font-size: 12px;
    color: var(--muted);
  }

  .pane-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .msg {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg .meta {
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .msg.mine {
    align-self: flex-end;
    background: #2b3550;
    border: 1px solid #3a4568;
  }
  .msg.theirs {
    align-self: flex-start;
    background: #1c2029;
    border: 1px solid var(--panel-border);
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--system);
    font-size: 12px;
    font-style: italic;
    max-width: 90%;
    text-align: center;
  }
  .msg.error {
    align-self: center;
    background: rgba(229,72,77,0.12);
    border: 1px solid rgba(229,72,77,0.4);
    color: #ff8b8e;
    font-size: 12.5px;
  }

  .pane-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--panel-border);
    display: flex;
    gap: 8px;
  }
  .pane-footer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13.5px;
  }
  .pane-footer input:disabled { opacity: 0.5; }
  .pane-footer input:focus { outline: 1px solid #4a90e2; }

  button {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.9); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .connect-btn { background: #2b3550; color: var(--text); }
  .send-btn { background: #3a4568; color: var(--text); }

  #doctor-pane .pane-header .who { color: var(--doctor); }
  #patient-pane .pane-header .who { color: var(--patient); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Chat WS Tester</h1>
  <div class="field">
    <label>WebSocket base URL</label>
    <input id="wsBase" value="ws://localhost:8000/chat/ws" placeholder="ws://localhost:8000/chat/ws">
  </div>
  <div class="field">
    <label>Slot ID</label>
    <input id="slotId" placeholder="6a670978ba52eb2d9aa0b789">
  </div>
</header>

<div class="panes">
  <div class="pane" id="doctor-pane" data-role="doctor" data-color="var(--doctor)">
    <div class="pane-header">
      <div class="who"><span class="dot" id="doctor-dot"></span> Doctor</div>
      <input id="doctor-token" placeholder="doctor JWT token" style="width:220px; background:var(--panel); border:1px solid var(--panel-border); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; font-family:ui-monospace,monospace;">
      <button class="connect-btn" id="doctor-connect">Connect</button>
    </div>
    <div class="pane-body" id="doctor-body"></div>
    <div class="pane-footer">
      <input id="doctor-input" placeholder="Type a message..." disabled>
      <button class="send-btn" id="doctor-send" disabled>Send</button>
    </div>
  </div>

  <div class="pane" id="patient-pane" data-role="patient" data-color="var(--patient)">
    <div class="pane-header">
      <div class="who"><span class="dot" id="patient-dot"></span> Patient</div>
      <input id="patient-token" placeholder="patient JWT token" style="width:220px; background:var(--panel); border:1px solid var(--panel-border); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; font-family:ui-monospace,monospace;">
      <button class="connect-btn" id="patient-connect">Connect</button>
    </div>
    <div class="pane-body" id="patient-body"></div>
    <div class="pane-footer">
      <input id="patient-input" placeholder="Type a message..." disabled>
      <button class="send-btn" id="patient-send" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  const sockets = { doctor: null, patient: null };

  function addMsg(role, type, content, sender) {
    const body = document.getElementById(`${role}-body`);
    const div = document.createElement('div');

    if (type === 'system') {
      div.className = 'msg system';
      div.textContent = content;
    } else if (type === 'error') {
      div.className = 'msg error';
      div.textContent = '⚠ ' + content;
    } else {
      const mine = sender === role;
      div.className = 'msg ' + (mine ? 'mine' : 'theirs');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = sender ? sender : '';
      div.appendChild(meta);
      const text = document.createElement('div');
      text.textContent = content;
      div.appendChild(text);
    }
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function setConnected(role, connected, errored) {
    const dot = document.getElementById(`${role}-dot`);
    dot.className = 'dot' + (errored ? ' error' : connected ? ' connected' : '');
    document.getElementById(`${role}-input`).disabled = !connected;
    document.getElementById(`${role}-send`).disabled = !connected;
    document.getElementById(`${role}-connect`).textContent = connected ? 'Disconnect' : 'Connect';
  }

  function connect(role) {
    if (sockets[role]) {
      sockets[role].close();
      sockets[role] = null;
      setConnected(role, false);
      return;
    }

    const base = document.getElementById('wsBase').value.trim();
    const slotId = document.getElementById('slotId').value.trim();
    const token = document.getElementById(`${role}-token`).value.trim();

    if (!base || !slotId || !token) {
      addMsg(role, 'error', 'Fill in WebSocket base URL, Slot ID, and token first.');
      return;
    }

    const url = `${base.replace(/\/$/, '')}/${slotId}?token=${encodeURIComponent(token)}`;
    const ws = new WebSocket(url);
    sockets[role] = ws;

    ws.onopen = () => {
      setConnected(role, true);
      addMsg(role, 'system', 'connected');
    };

    ws.onmessage = (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch { data = { type: 'system', content: event.data }; }
      if (data.type === 'message') {
        addMsg(role, 'message', data.content, data.sender_role);
      } else if (data.type === 'system') {
        addMsg(role, 'system', data.content);
      } else if (data.type === 'error') {
        addMsg(role, 'error', data.content);
      }
    };

    ws.onerror = () => {
      setConnected(role, false, true);
    };

    ws.onclose = (event) => {
      sockets[role] = null;
      setConnected(role, false);
      addMsg(role, 'system', `closed — code ${event.code}${event.reason ? ': ' + event.reason : ''}`);
    };
  }

  function sendMsg(role) {
    const ws = sockets[role];
    const input = document.getElementById(`${role}-input`);
    const content = input.value.trim();
    if (!ws || ws.readyState !== WebSocket.OPEN || !content) return;
    ws.send(JSON.stringify({ content }));
    input.value = '';
  }

  ['doctor', 'patient'].forEach(role => {
    document.getElementById(`${role}-connect`).onclick = () => connect(role);
    document.getElementById(`${role}-send`).onclick = () => sendMsg(role);
    document.getElementById(`${role}-input`).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMsg(role);
    });
  });
</script>

</body>
</html>
